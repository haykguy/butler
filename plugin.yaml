name: overseer
version: 0.2.0
description: Proactive assistant controls with live local-time and session-lifetime awareness, Hermes system notification/load controls, responsibility persistence, and opt-in DM event capture.
author: Overseer contributors
kind: standalone
requires_hermes: '>=0.23.1'
config_schema:
  collect_event_history:
    type: boolean
    default: false
    description: Opt in to plaintext admitted DM event collection; records do not expire automatically and replay is disabled pending an authenticated session identity API.
provides_tools:
  - overseer_create
  - overseer_manage
  - overseer_expression
  - overseer_controls
provides_hooks:
  - post_gateway_admission
  - pre_llm_call
