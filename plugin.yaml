name: butler
version: 0.3.0
description: "Butler — the proactive personal assistant for Hermes Agent. Messages you first, acts on webhooks, tracks commitments, calls when urgent, with live local-time awareness and privacy-first guardrails."
author: Butler contributors
kind: standalone
requires_hermes: '>=0.23.1'
config_schema:
  collect_event_history:
    type: boolean
    default: false
    description: Opt in to plaintext admitted DM event collection; records do not expire automatically and replay is disabled pending an authenticated session identity API.
provides_tools:
  - butler_create
  - butler_manage
  - butler_expression
  - butler_imessage
  - butler_controls
provides_hooks:
  - post_gateway_admission
  - pre_llm_call
