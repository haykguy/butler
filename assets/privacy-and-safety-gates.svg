<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Butler privacy and fail-closed safety boundaries">
  <rect width="1200" height="380" rx="18" fill="#0d0c0a" stroke="#3a352b" stroke-width="1.5"/>
  <text x="600" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#faf6ee">Defense-in-Depth: Dual-Gate Consent &amp; Fail-Closed Security Boundaries</text>
  <text x="600" y="63" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a89e8a">Every sensitive capability defaults OFF, validates strictly, and fails closed rather than trusting spoofable state</text>

  <!-- Gate 1 -->
  <g transform="translate(32, 92)">
    <rect width="360" height="256" rx="14" fill="#1a1814" stroke="#9e3b3b" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="22" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#d9a0a0">1 · DUAL-LOCK DM CAPTURE (DEFAULT OFF)</text>
    <text x="22" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ece4d2">Inbound DMs are NEVER recorded unless BOTH</text>
    <text x="22" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ece4d2">independent locks are explicitly enabled:</text>
    <rect x="22" y="96" width="316" height="52" rx="8" fill="#0d0c0a" stroke="#3a352b"/>
    <text x="34" y="117" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#e0c27a">Lock A: collect_event_history == true</text>
    <text x="34" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#a89e8a">Host config.yaml plugin setting (default: false)</text>
    <rect x="22" y="158" width="316" height="52" rx="8" fill="#0d0c0a" stroke="#3a352b"/>
    <text x="34" y="179" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#d4b978">Lock B: activityEnabled &amp;&amp; !paused</text>
    <text x="34" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#a89e8a">Profile UI consent — immutable by LLM tools</text>
    <text x="22" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#d9cfbb">✓ Stable message_id required · Untrusted XML tags</text>
  </g>

  <!-- Gate 2 -->
  <g transform="translate(420, 92)">
    <rect width="360" height="256" rx="14" fill="#1a1814" stroke="#e0c27a" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="22" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ecd59a">2 · FAIL-CLOSED SESSION IDENTITY</text>
    <text x="22" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ece4d2">Butler refuses to trust spoofable env vars</text>
    <text x="22" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ece4d2">or import private Hermes core internals:</text>
    <rect x="22" y="96" width="316" height="52" rx="8" fill="#0d0c0a" stroke="#3a352b"/>
    <text x="34" y="117" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#b85c5c">✗ HERMES_SESSION_KEY env fallback</text>
    <text x="34" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#a89e8a">Rejected — caller/tool subprocesses could spoof</text>
    <rect x="22" y="158" width="316" height="52" rx="8" fill="#0d0c0a" stroke="#3a352b"/>
    <text x="34" y="179" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#b85c5c">✗ gateway.session_context private import</text>
    <text x="34" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#a89e8a">Avoided — keeps 100% public catalog compliance</text>
    <text x="22" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#d9cfbb">✓ Wake routes &amp; DM replay fail closed safely</text>
  </g>

  <!-- Gate 3 -->
  <g transform="translate(808, 92)">
    <rect width="360" height="256" rx="14" fill="#1a1814" stroke="#c9a961" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="22" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e3cf9b">3 · ATOMIC POLICY &amp; CREDENTIAL SAFETY</text>
    <text x="22" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ece4d2">Strict schema checks, cross-process SQLite</text>
    <text x="22" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ece4d2">locks, and zero credential exposure:</text>
    <rect x="22" y="96" width="316" height="52" rx="8" fill="#0d0c0a" stroke="#3a352b"/>
    <text x="34" y="117" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#c9a961">Policy.reserve_wake(now) + Leases</text>
    <text x="34" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#a89e8a">BEGIN IMMEDIATE transactions prevent floods</text>
    <rect x="22" y="158" width="316" height="52" rx="8" fill="#0d0c0a" stroke="#3a352b"/>
    <text x="34" y="179" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#d4b978">chmod 0600 + ?mode=ro + Allowlists</text>
    <text x="34" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#a89e8a">Read-only UI DB · Never asks for passwords in chat</text>
    <text x="22" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#d9cfbb">✓ HTTP 422 rejects any malformed/out-of-range input</text>
  </g>
</svg>
