<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Butler per-turn hook and tool execution lifecycle">
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0908"/>
      <stop offset="100%" stop-color="#14130f"/>
    </linearGradient>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c9a961"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#flowBg)" stroke="#3a352b" stroke-width="1.5"/>
  <text x="600" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#faf6ee">Per-Turn Execution Timeline — From Inbound Message to Calibrated Response</text>
  <text x="600" y="61" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a89e8a">Deterministic clock &amp; turn-gap computation · Subagent isolation · Atomic SQLite &amp; config.yaml persistence</text>

  <!-- Step 1 -->
  <g transform="translate(28, 92)">
    <rect width="210" height="292" rx="14" fill="#1a1814" stroke="#c9a961" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="16" y="16" width="178" height="30" rx="8" fill="#4a3a1a"/>
    <text x="105" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#e3cf9b">1 · INBOUND ADMISSION</text>
    <text x="16" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#faf6ee">post_gateway_admission</text>
    <text x="16" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Resolves active profile</text>
    <text x="16" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  via plugin_data_dir()</text>
    <text x="16" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Lazily starts Runner</text>
    <text x="16" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  on admitted gateway</text>
    <text x="16" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Checks Dual Privacy</text>
    <text x="16" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  Locks before any DM</text>
    <text x="16" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  ledger write occurs</text>
    <rect x="16" y="240" width="178" height="36" rx="7" fill="#0d0c0a" stroke="#24211b"/>
    <text x="105" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#a89e8a">Default: 0 bytes logged</text>
  </g>

  <line x1="238" y1="238" x2="262" y2="238" stroke="#c9a961" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Step 2 -->
  <g transform="translate(268, 92)">
    <rect width="224" height="292" rx="14" fill="#1a1814" stroke="#e0c27a" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="16" y="16" width="192" height="30" rx="8" fill="#4a3a1a"/>
    <text x="112" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#f2e3b5">2 · TURN PROLOGUE</text>
    <text x="16" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#faf6ee">pre_llm_call (Primary)</text>
    <text x="16" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Skips child subagents</text>
    <text x="16" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  (parent_session_id != '')</text>
    <text x="16" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Resolves IANA zone:</text>
    <text x="16" y="156" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#e0c27a">  profile → cfg → OS → UTC</text>
    <text x="16" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Computes session age,</text>
    <text x="16" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  gap since user &amp; reply,</text>
    <text x="16" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  quiet window &amp; posture</text>
    <rect x="16" y="240" width="192" height="36" rx="7" fill="#0d0c0a" stroke="#24211b"/>
    <text x="112" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#f2e3b5">Returns {'context': ...}</text>
  </g>

  <line x1="492" y1="238" x2="516" y2="238" stroke="#c9a961" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Step 3 -->
  <g transform="translate(522, 92)">
    <rect width="214" height="292" rx="14" fill="#1a1814" stroke="#b8964f" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="16" y="16" width="182" height="30" rx="8" fill="#2e2412"/>
    <text x="107" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#e8d7a8">3 · MODEL REASONING</text>
    <text x="16" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#faf6ee">Calibrated LLM Turn</text>
    <text x="16" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Knows exact local time</text>
    <text x="16" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  &amp; overnight/rapid gaps</text>
    <text x="16" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Adapts voice to Tone &amp;</text>
    <text x="16" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  Persistence settings</text>
    <text x="16" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Decides autonomously</text>
    <text x="16" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  when to invoke tools vs</text>
    <text x="16" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  reply concisely</text>
    <rect x="16" y="240" width="182" height="36" rx="7" fill="#0d0c0a" stroke="#24211b"/>
    <text x="107" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#e8d7a8">No auxiliary judge leak</text>
  </g>

  <line x1="736" y1="238" x2="760" y2="238" stroke="#c9a961" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Step 4 -->
  <g transform="translate(766, 92)">
    <rect width="196" height="292" rx="14" fill="#1a1814" stroke="#e8dcc4" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="16" y="16" width="164" height="30" rx="8" fill="#2a241a"/>
    <text x="98" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#f3ecdc">4 · TOOL DISPATCH</text>
    <text x="16" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#faf6ee">Guarded Actions</text>
    <text x="16" y="96" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#efe6d3">butler_controls</text>
    <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#d9cfbb">  TZ &amp; Quiet Preset sync</text>
    <text x="16" y="140" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#efe6d3">butler_create/manage</text>
    <text x="16" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#d9cfbb">  SQLite commitments</text>
    <text x="16" y="184" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#efe6d3">butler_expression</text>
    <text x="16" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#d9cfbb">  Tapbacks/replies/FX</text>
    <rect x="16" y="240" width="164" height="36" rx="7" fill="#0d0c0a" stroke="#24211b"/>
    <text x="98" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#f3ecdc">Privacy keys locked</text>
  </g>

  <line x1="962" y1="238" x2="986" y2="238" stroke="#c9a961" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Step 5 -->
  <g transform="translate(992, 92)">
    <rect width="180" height="292" rx="14" fill="#1a1814" stroke="#d4b978" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="14" y="16" width="152" height="30" rx="8" fill="#3d3018"/>
    <text x="90" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#f0e6c8">5 · CLEAN DELIVERY</text>
    <text x="14" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#faf6ee">Human-First Output</text>
    <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Concise natural text</text>
    <text x="14" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Muted warning &amp;</text>
    <text x="14" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  tool-progress bloat</text>
    <text x="14" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Synced live in</text>
    <text x="14" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  Hermes Desktop UI</text>
    <text x="14" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">• Survives /new &amp;</text>
    <text x="14" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9cfbb">  gateway restarts</text>
    <rect x="14" y="240" width="152" height="36" rx="7" fill="#0d0c0a" stroke="#24211b"/>
    <text x="90" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#e8d7a8">0 private core imports</text>
  </g>
</svg>
