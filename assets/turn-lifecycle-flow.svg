<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Overseer per-turn hook and tool execution lifecycle">
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#flowBg)" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Per-Turn Execution Timeline — From Inbound Message to Calibrated Response</text>
  <text x="600" y="61" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8">Deterministic clock &amp; turn-gap computation · Subagent isolation · Atomic SQLite &amp; config.yaml persistence</text>

  <!-- Step 1 -->
  <g transform="translate(28, 92)">
    <rect width="210" height="292" rx="14" fill="#131d31" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="16" y="16" width="178" height="30" rx="8" fill="#0c4a6e"/>
    <text x="105" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">1 · INBOUND ADMISSION</text>
    <text x="16" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#f8fafc">post_gateway_admission</text>
    <text x="16" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Resolves active profile</text>
    <text x="16" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  via plugin_data_dir()</text>
    <text x="16" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Lazily starts Runner</text>
    <text x="16" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  on admitted gateway</text>
    <text x="16" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Checks Dual Privacy</text>
    <text x="16" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  Locks before any DM</text>
    <text x="16" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  ledger write occurs</text>
    <rect x="16" y="240" width="178" height="36" rx="7" fill="#0b1120" stroke="#1e293b"/>
    <text x="105" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#94a3b8">Default: 0 bytes logged</text>
  </g>

  <line x1="238" y1="238" x2="262" y2="238" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Step 2 -->
  <g transform="translate(268, 92)">
    <rect width="224" height="292" rx="14" fill="#131d31" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="16" y="16" width="192" height="30" rx="8" fill="#78350f"/>
    <text x="112" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#fde68a">2 · TURN PROLOGUE</text>
    <text x="16" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#f8fafc">pre_llm_call (Primary)</text>
    <text x="16" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Skips child subagents</text>
    <text x="16" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  (parent_session_id != '')</text>
    <text x="16" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Resolves IANA zone:</text>
    <text x="16" y="156" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#fbbf24">  profile → cfg → OS → UTC</text>
    <text x="16" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Computes session age,</text>
    <text x="16" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  gap since user &amp; reply,</text>
    <text x="16" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  quiet window &amp; posture</text>
    <rect x="16" y="240" width="192" height="36" rx="7" fill="#0b1120" stroke="#1e293b"/>
    <text x="112" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#fde68a">Returns {'context': ...}</text>
  </g>

  <line x1="492" y1="238" x2="516" y2="238" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Step 3 -->
  <g transform="translate(522, 92)">
    <rect width="214" height="292" rx="14" fill="#131d31" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="16" y="16" width="182" height="30" rx="8" fill="#064e3b"/>
    <text x="107" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#6ee7b7">3 · MODEL REASONING</text>
    <text x="16" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#f8fafc">Calibrated LLM Turn</text>
    <text x="16" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Knows exact local time</text>
    <text x="16" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  &amp; overnight/rapid gaps</text>
    <text x="16" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Adapts voice to Tone &amp;</text>
    <text x="16" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  Persistence settings</text>
    <text x="16" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Decides autonomously</text>
    <text x="16" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  when to invoke tools vs</text>
    <text x="16" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  reply concisely</text>
    <rect x="16" y="240" width="182" height="36" rx="7" fill="#0b1120" stroke="#1e293b"/>
    <text x="107" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#6ee7b7">No auxiliary judge leak</text>
  </g>

  <line x1="736" y1="238" x2="760" y2="238" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Step 4 -->
  <g transform="translate(766, 92)">
    <rect width="196" height="292" rx="14" fill="#131d31" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="16" y="16" width="164" height="30" rx="8" fill="#3b0764"/>
    <text x="98" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#d8b4fe">4 · TOOL DISPATCH</text>
    <text x="16" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#f8fafc">Guarded Actions</text>
    <text x="16" y="96" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#c4b5fd">overseer_controls</text>
    <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">  TZ &amp; Quiet Preset sync</text>
    <text x="16" y="140" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#c4b5fd">overseer_create/manage</text>
    <text x="16" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">  SQLite commitments</text>
    <text x="16" y="184" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#c4b5fd">overseer_expression</text>
    <text x="16" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">  Tapbacks/replies/FX</text>
    <rect x="16" y="240" width="164" height="36" rx="7" fill="#0b1120" stroke="#1e293b"/>
    <text x="98" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#d8b4fe">Privacy keys locked</text>
  </g>

  <line x1="962" y1="238" x2="986" y2="238" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Step 5 -->
  <g transform="translate(992, 92)">
    <rect width="180" height="292" rx="14" fill="#131d31" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="14" y="16" width="152" height="30" rx="8" fill="#065f46"/>
    <text x="90" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#a7f3d0">5 · CLEAN DELIVERY</text>
    <text x="14" y="70" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#f8fafc">Human-First Output</text>
    <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Concise natural text</text>
    <text x="14" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Muted warning &amp;</text>
    <text x="14" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  tool-progress bloat</text>
    <text x="14" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Synced live in</text>
    <text x="14" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  Hermes Desktop UI</text>
    <text x="14" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• Survives /new &amp;</text>
    <text x="14" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">  gateway restarts</text>
    <rect x="14" y="240" width="152" height="36" rx="7" fill="#0b1120" stroke="#1e293b"/>
    <text x="90" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#6ee7b7">0 private core imports</text>
  </g>
</svg>
